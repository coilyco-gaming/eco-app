<section>
  <h2 class="section-title">Players</h2>
  <ul class="cards">
    {% for p in players %}
      <li class="card{% if not p.active %} dim{% endif %}">
        <h3 class="card-title">
          {{ p.name }}
          {% if p.active %}
            <span class="pill pill-active">active</span>
          {% else %}
            <span class="pill pill-inactive">inactive</span>
          {% endif %}
        </h3>
        <ul class="rows">
          {% for s in p.specialties %}
            <li>
              <span>{{ s.specialty }}</span>
              <span class="lvl">lvl {{ s.level }}</span>
            </li>
          {% endfor %}
        </ul>
      </li>
    {% endfor %}
  </ul>
</section>
