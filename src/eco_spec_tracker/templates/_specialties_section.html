<section>
  <h2 class="section-title">Specialties</h2>
  <ul class="cards">
    {% for s in specialties %}
      <li class="card{% if s.active == 0 %} dim{% endif %}">
        <h3 class="card-title">
          {{ s.name }}
          <span class="count">( {{ s.active }} / {{ s.total }} )</span>
        </h3>
        <p class="kicker">{{ s.profession }}</p>
        <ul class="rows">
          {% for h in s.holders %}
            <li{% if not h.active %} class="faded"{% endif %}>
              <span>{{ h.player }}</span>
              <span class="lvl">lvl {{ h.level }}</span>
            </li>
          {% endfor %}
        </ul>
      </li>
    {% endfor %}
  </ul>
</section>
