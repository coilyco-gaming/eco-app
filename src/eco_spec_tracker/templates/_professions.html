<ul class="cards">
  {% for s in stats %}
    <li class="card card-tight{% if s.total == 0 %} dim{% endif %}">
      <button
        class="prof-btn"
        hx-get="{{ request.scope.root_path }}/partials/profession/{{ s.profession }}"
        hx-target="#detail-{{ loop.index }}"
        hx-swap="innerHTML"
      >
        <span>{{ s.profession }}</span>
        <span class="count">( {{ s.active }} / {{ s.total }} )</span>
      </button>
      <div id="detail-{{ loop.index }}" class="detail"></div>
    </li>
  {% endfor %}
</ul>
