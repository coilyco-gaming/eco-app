<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>eco-replay</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://unpkg.com/htmx.org@2.0.3"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  pre { white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body class="bg-slate-900 text-slate-100">
<div class="max-w-5xl mx-auto p-6">
  <header class="mb-6 flex items-baseline justify-between">
    <h1 class="text-2xl font-bold text-emerald-400">eco-replay</h1>
    <span class="text-xs text-slate-400">player action recorder</span>
  </header>
  {% if using_mock_data %}
  <div class="bg-amber-900/40 border border-amber-700 text-amber-200 text-sm rounded px-3 py-2 mb-4">
    Mock data. Set <code>UPSTREAM_URL</code> to the running mod's
    <code>/api/v1/events</code> endpoint to see live records.
  </div>
  {% endif %}
  {% block body %}{% endblock %}
</div>
</body>
</html>
