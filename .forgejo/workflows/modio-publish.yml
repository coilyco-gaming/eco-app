name: modio-publish

# A deliberate promotion boundary: normal main builds neither call nor depend
# on mod.io. This workflow only uploads ZIP bytes already in Forgejo Packages.
on:
  workflow_dispatch:
    inputs:
      package:
        description: Forgejo package to promote
        required: true
        type: choice
        options:
          - eco-jobs-tracker
          - eco-replay
          - eco-store-exporter
          - eco-telemetry
      registry_version:
        description: Immutable Forgejo package version (for example 1.2.3+<full-sha>)
        required: true
        type: string
      archive_name:
        description: Exact ZIP filename from that Forgejo package version
        required: true
        type: string
      modio_game_id:
        description: mod.io game ID for this target (not stored in the repository)
        required: true
        type: string
      modio_mod_id:
        description: mod.io mod ID for this target (not stored in the repository)
        required: true
        type: string
      modio_file_id:
        description: Optional existing mod.io file ID to verify on a retry
        required: false
        type: string
      release_notes:
        description: Release notes sent as the mod.io file changelog
        required: false
        type: string
      dry_run:
        description: Verify Forgejo artifacts only; do not contact mod.io
        required: true
        default: true
        type: boolean

jobs:
  promote:
    runs-on: docker
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    steps:
      - uses: actions/checkout@v4
      - name: Require promotion credentials
        env:
          FORGEJO_PACKAGE_TOKEN: ${{ secrets.ECO_MOD_PACKAGE_TOKEN }}
        run: |
          set -eu
          [ -n "$FORGEJO_PACKAGE_TOKEN" ] || { echo "ECO_MOD_PACKAGE_TOKEN is required" >&2; exit 1; }
      - name: Require mod.io publisher credential
        if: ${{ !inputs.dry_run }}
        env:
          MODIO_ACCESS_TOKEN: ${{ secrets.MODIO_ACCESS_TOKEN }}
        run: |
          set -eu
          [ -n "$MODIO_ACCESS_TOKEN" ] || { echo "MODIO_ACCESS_TOKEN is required" >&2; exit 1; }
      - name: Verify and promote the published package
        env:
          FORGEJO_PACKAGE_URL: ${{ github.server_url }}
          FORGEJO_PACKAGE_OWNER: coilyco-gaming
          FORGEJO_PACKAGE_USER: ${{ github.actor }}
          FORGEJO_PACKAGE_TOKEN: ${{ secrets.ECO_MOD_PACKAGE_TOKEN }}
          MOD_PACKAGE_NAME: ${{ inputs.package }}
          MOD_PACKAGE_VERSION: ${{ inputs.registry_version }}
          MOD_PACKAGE_ARCHIVE: ${{ inputs.archive_name }}
          MODIO_GAME_ID: ${{ inputs.modio_game_id }}
          MODIO_MOD_ID: ${{ inputs.modio_mod_id }}
          MODIO_FILE_ID: ${{ inputs.modio_file_id }}
          MODIO_ACCESS_TOKEN: ${{ secrets.MODIO_ACCESS_TOKEN }}
          MODIO_CHANGELOG: ${{ inputs.release_notes }}
          MODIO_DRY_RUN: ${{ inputs.dry_run }}
        run: python3 scripts/modio_publish.py
      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API_BASE: https://api.telegram.org
        run: "python3 -c 'exec(\"import os\\nimport sys\\nimport urllib.error\\nimport urllib.parse\\nimport urllib.request\\n\\ndef build_message():\\n    return \\\"\\\\n\\\".join([\\n        \\\"CI failed on main\\\",\\n        f\\\"repo: {os.environ['\"'\"'REPO'\"'\"']}\\\",\\n        f\\\"workflow: {os.environ['\"'\"'WORKFLOW'\"'\"']}\\\",\\n        f\\\"job: {os.environ['\"'\"'JOB'\"'\"']}\\\",\\n        f\\\"ref: {os.environ['\"'\"'REF'\"'\"']}\\\",\\n        f\\\"sha: {os.environ['\"'\"'SHA'\"'\"']}\\\",\\n        f\\\"run: {os.environ['\"'\"'RUN_URL'\"'\"']}\\\",\\n    ])\\n\\ndef main():\\n    bot_token = os.environ.get(\\\"BOT_TOKEN\\\", \\\"\\\")\\n    chat_id = os.environ.get(\\\"CHAT_ID\\\", \\\"\\\")\\n    if not bot_token or not chat_id:\\n        print(\\\"telegram alert missing required secret\\\", file=sys.stderr)\\n        return 2\\n    proxy_url = os.environ.get(\\\"FORGEJO_EGRESS_PROXY\\\", \\\"\\\").strip()\\n    payload = urllib.parse.urlencode(\\n        {\\n            \\\"chat_id\\\": chat_id,\\n            \\\"text\\\": build_message(),\\n            \\\"disable_web_page_preview\\\": \\\"true\\\",\\n        }\\n    ).encode(\\\"utf-8\\\")\\n    api_base = os.environ.get(\\\"API_BASE\\\", \\\"https://api.telegram.org\\\").rstrip(\\\"/\\\")\\n    request = urllib.request.Request(\\n        f\\\"{api_base}/bot{bot_token}/sendMessage\\\",\\n        data=payload,\\n        method=\\\"POST\\\",\\n    )\\n    opener = urllib.request.build_opener(\\n        urllib.request.ProxyHandler({\\\"https\\\": proxy_url})\\n        if proxy_url\\n        else urllib.request.ProxyHandler()\\n    )\\n    try:\\n        with opener.open(request, timeout=15) as response:\\n            response.read()\\n    except urllib.error.URLError as exc:\\n        print(f\\\"telegram alert failed ({type(exc).__name__})\\\", file=sys.stderr)\\n        return 1\\n    return 0\\n\\nraise SystemExit(main())\\n\")'"
