name: build-publish

# Tests, builds, and publishes the fused eco-app image to the in-cluster
# registry on every push to main. There is deliberately NO deploy stage here:
# rollout is driven from coilyco-bridge/deploy/services/eco-app per the layer
# invariant (infra -> eco-app -> deploy). See coilysiren/inbox#101.

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: docker
    # CI parity: run the Python validation gate inside the pinned aos dev-base
    # image, through the same `ward exec` verbs a headless agent runs, so this
    # gate IS the gate dispatched `warded` runs must pass. CI (`runs-on: docker`
    # + `astral-sh/setup-uv`) stayed green while three dispatched runs died on
    # the smoke gate in dev-base (eco-app#56); running here through ward would
    # have caught it on a PR instead of in a silent dispatch failure. See
    # eco-app#57 and the aos CI-parity umbrella (agentic-os#328).
    #
    # The tag is PINNED, not `:latest`, on purpose: a dev-base bump is then a
    # deliberate PR that re-validates eco-app against the new image, never a
    # silent drift under a moving tag. Bump it in lockstep with the ward version
    # the agents actually run. dev-base bakes ward + uv + managed Pythons, so no
    # setup-uv / sync step is needed - `ward exec` (make -> uv run) syncs the
    # dev group on demand.
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:v0.195.0
    steps:
      - uses: actions/checkout@v4
      - run: ward exec test
      - run: ward exec lint
      - run: ward exec smoke

  frontend:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      # The docker runner label resolves to node:20-bookworm, so corepack is
      # already aboard; the packageManager field in package.json pins pnpm.
      - name: Enable pnpm via corepack
        run: COREPACK_ENABLE_DOWNLOAD_PROMPT=0 corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm lint
        working-directory: frontend
      - run: pnpm test
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend

  mods:
    runs-on: docker
    # Compile the four C# Eco mods (mods/{jobs,replay,telemetry,stores}) as a
    # standalone gate. The mods are built by the build-mod-* ward verbs and
    # shipped to the game server OUT OF BAND - they are NOT in the eco-app image
    # (SPA + MCP + jobs) - so a compile error otherwise reaches the live server
    # caught by no gate. This job is that gate/signal for the out-of-band mod
    # shipping step. It is deliberately DECOUPLED from `publish`'s needs
    # (eco-app#68): a mod that fails to compile has zero bearing on whether the
    # mod-less app image is publishable, so it must never block the publish.
    # #60 wired this gate into publish's needs by mistake and, being red on
    # every run, froze prod from #60 until #68 dropped it here.
    #
    # Runs inside the SAME pinned aos dev-base image as the `test` job, through
    # the same `ward exec` verb an agent runs (CI parity, agentic-os#328).
    # dev-base ships the pinned .NET 10 SDK + full ICU (agentic-os#329), so the
    # image provides `dotnet` on PATH and `ward exec build-mods` (make -> dotnet
    # build) just works - no self-installed SDK, and no
    # DOTNET_SYSTEM_GLOBALIZATION_INVARIANT (the image runs full ICU, not
    # invariant mode). This replaced the old node:20-bookworm self-install path,
    # which failed on every run since #60 (eco-app#68). Bump this pin in lockstep
    # with the `test` job's.
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:v0.195.0
    steps:
      - uses: actions/checkout@v4
      - run: ward exec build-mods

  publish:
    runs-on: docker
    # NOT `needs: mods`: the app image is SPA + MCP + jobs (Python/Node) and
    # contains no C# mods, so mod compilation has no bearing on whether it is
    # publishable. The image is fully validated by `test` (pytest/ruff/mypy/
    # smoke) and `frontend` (lint/test/build). The `mods` job stays a separate
    # required signal for the out-of-band mod-shipping step, never a publish
    # gate. See eco-app#68 (which unfroze prod by dropping mods from here).
    needs: [test, frontend]
    steps:
      - uses: actions/checkout@v4
      # The `docker` runner label resolves to node:20-bookworm, which ships
      # git + curl but no docker CLI. Pull it in as a static binary (apt-free,
      # so no daemon postinst runs in the job container): docker talks to the
      # DinD sidecar over DOCKER_HOST. See coilysiren/backend#26.
      - name: Install docker CLI
        run: |
          set -euo pipefail
          docker_cli_ver=$(curl -fsSL https://download.docker.com/linux/static/stable/x86_64/ \
            | grep -oE 'docker-[0-9]+\.[0-9]+\.[0-9]+\.tgz' | sort -V | tail -1 \
            | sed -E 's/^docker-(.*)\.tgz$/\1/')
          curl -fsSL "https://download.docker.com/linux/static/stable/x86_64/docker-${docker_cli_ver}.tgz" \
            | tar -xz -C /tmp
          install /tmp/docker/docker /usr/local/bin/docker
      # The DinD sidecar shares the runner pod's netns and listens on :2375
      # there, but the job container sits on a separate per-workflow docker
      # bridge - so the inherited DOCKER_HOST=tcp://localhost:2375 points at
      # the job container's own loopback, not dockerd. dockerd is reachable at
      # the job container's default-route gateway (the pod netns). Probe
      # candidates and pin the first that answers. See coilysiren/backend#26.
      - name: Resolve docker host
        run: |
          set -euo pipefail
          gw=$(node -e "const fs=require('fs');const l=(fs.readFileSync('/proc/net/route','utf8').split('\n').find(x=>x.split('\t')[1]==='00000000'))||'';const h=l.split(/\s+/)[2]||'';if(h){console.log(h.match(/../g).reverse().map(x=>parseInt(x,16)).join('.'))}" || true)
          for h in "tcp://${gw}:2375" "${DOCKER_HOST:-}" tcp://localhost:2375 unix:///var/run/docker.sock; do
            [ -z "$h" ] && continue
            [ "$h" = "tcp://:2375" ] && continue
            if docker -H "$h" info >/dev/null 2>&1; then
              echo "docker daemon reachable at $h"
              echo "DOCKER_HOST=$h" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "no docker daemon at $h"
          done
          echo "no reachable docker daemon" >&2
          exit 1
      # Build the image and push it to the in-cluster registry. The DinD
      # sidecar carries --insecure-registry=192.168.0.194:30500, so the
      # plain-http push to the NodePort registry round-trips. No tailnet join,
      # no GHCR, no docker-save sideload. See coilysiren/infrastructure#168, #171.
      # Use the legacy builder: the static docker CLI ships no buildx plugin,
      # so BuildKit (--progress, inline cache) is unavailable. A plain build
      # against the daemon is enough for this single image.
      - name: Build and push
        run: |
          set -euo pipefail
          IMAGE=192.168.0.194:30500/coilysiren-eco-app:${{ github.sha }}
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
