# Per-repo command allowlist for the eco-app monorepo (the `ward` gate).
#
# Deploy verbs are deliberately absent - the deploy surface for this service
# lives in coilyco-bridge/deploy/services/eco-app per the layer invariant
# (infra -> eco-app -> deploy). See coilysiren/inbox#101.

commands:
  sync:
    run: bash scripts/ward-command.sh sync
    description: uv lock + uv sync with dev deps.
  test:
    run: bash scripts/ward-command.sh test
    description: Run the pytest suite (tests/mcp + tests/jobs + tests/replay).
  lint:
    run: bash scripts/ward-command.sh lint
    description: ruff check + ruff format --check + mypy on src/ and tests/.
  fmt:
    run: bash scripts/ward-command.sh fmt
    description: Apply ruff fixes and formatting in place.
  precommit:
    run: bash scripts/ward-command.sh precommit
    description: Run all pre-commit hooks against every file.
  smoke:
    run: bash scripts/ward-command.sh smoke
    description: End-to-end smoke test the MCP server via stdio.
  frontend-install:
    run: pnpm --dir frontend install
    description: Install frontend deps into frontend/node_modules (pnpm).
  frontend-dev:
    run: pnpm --dir frontend dev
    description: Vite dev server with HMR on :5173, proxying API routes to :4000.
  frontend-build:
    run: pnpm --dir frontend build
    description: Typecheck + production-build the React SPA into frontend/dist.
  frontend-test:
    run: pnpm --dir frontend test
    description: Run the frontend vitest suite.
  frontend-lint:
    run: pnpm --dir frontend lint
    description: ESLint over frontend/src.
  http:
    run: bash scripts/ward-command.sh http
    description: Run the fused server (MCP + /jobs) with autoreload, eco target auto-resolved. Native args - [--port PORT].
  http-offline:
    run: bash scripts/ward-command.sh http-offline
    description: Run the fused server against the local snapshot fixture instead of a live eco server. Native args - [--port PORT] [--fixture-port PORT].
  snapshot-capture:
    run: bash scripts/ward-command.sh snapshot-capture
    description: Capture every upstream eco-server dataset into a local snapshot dir. Native args - [--snapshot-dir PATH].
  snapshot-push:
    run: bash scripts/ward-command.sh snapshot-push
    description: Tar the captured snapshot and push it to S3, timestamped plus latest. Native args - [--snapshot-dir PATH].
  snapshot-pull:
    run: bash scripts/ward-command.sh snapshot-pull
    description: Pull a snapshot tarball from S3 into the local snapshot dir. Native args - [--snapshot STAMP] [--snapshot-dir PATH].
  snapshot-serve:
    run: bash scripts/ward-command.sh snapshot-serve
    description: Replay the pulled snapshot as a fixture eco server on localhost. Native args - [--fixture-port PORT] [--snapshot-dir PATH].
  harness:
    run: bash scripts/ward-command.sh harness
    description: Serve static/harness.html, the local Claude-Desktop-mimicking iframe host. Native args - [--port PORT].
  install-desktop:
    run: python3 scripts/install_desktop_config.py
    description: Wire eco-mcp-app into Claude Desktop's claude_desktop_config.json.
  build-docker:
    run: bash scripts/ward-command.sh build-docker
    description: Build the eco-app docker image locally. Native args - [--name NAME] [--revision REVISION].
  build-mods:
    run: sh scripts/mods-gate.sh build-mods
    description: Discover, restore, and build every real Eco mod project with per-project timings.
  package-mods:
    run: bash scripts/ward-command.sh package-mods
    description: Build deterministic, install-ready Eco mod ZIPs under .build/mod-packages. Native args - [--revision REVISION].
  publish-mod-packages:
    run: python3 scripts/mod_packages.py publish
    description: Publish .build/mod-packages to Forgejo's generic package registry. Requires FORGEJO_PACKAGE_URL, OWNER, USER, and TOKEN.
  build-mod-jobs:
    run: dotnet build mods/jobs/src/EcoJobsTracker.csproj -c Release
    description: Build the jobs-tracker Eco mod DLL (mods/jobs/src).
  build-mod-replay:
    run: dotnet build mods/replay/src/EcoReplay.csproj -c Release
    description: Build the replay Eco mod DLL (mods/replay/src).
  test-mod-replay:
    run: sh scripts/mods-gate.sh test-mod-replay
    description: Restore and run the replay mod C# unit tests (mods/replay/tests) with per-phase timings.
  build-mod-telemetry:
    run: dotnet build mods/telemetry/EcoTelemetry.csproj -c Release
    description: Build the telemetry Eco mod DLL (mods/telemetry).
  build-mod-stores:
    run: dotnet build mods/stores/src/EcoStoreExporter.csproj -c Release
    description: Build the store-exporter Eco mod DLL (mods/stores/src).
  run-shell-jobs:
    run: dotnet run --project mods/jobs/shell/EcoJobsTracker.Shell.csproj
    description: Run the jobs C# shell harness on :5100 (same API shape as the real Eco mod).
  run-shell-stores:
    run: dotnet run --project mods/stores/shell/EcoStoreExporter.Shell.csproj
    description: Run the stores C# shell harness on :5101 (same API shape as the real Eco mod).

catalog:
  kind: Component
  type: service
  system: gaming
  owner: kai
  lifecycle: production
  description: "The Eco application monorepo: MCP/web service (eco_mcp_app), jobs tracker mounted at /jobs (eco_spec_tracker), replay viewer (eco_replay), and the in-game C# plugins under mods/. One fused image; deploy surface lives in coilyco-bridge/deploy."
  dependsOn:
    - github.com/StrangeLoopGames/Eco
